<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="icon" type="image/ico" href="./img/gem.png" sizes="64x64">
    <link rel="stylesheet" type="text/css" href="estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
    crossorigin="anonymous">
  </head>
  <body>
    <mi-menu></mi-menu>
    <form action="http://www.uv.es" id="form1" method="post">
    </form>

    <table class="formulario">
        <th id="contacto"><h3 class="contacto1">CREAR MI CUENTA</h3></th>     
        <tr>
            <td>Nombre:</td>
            <td>
                <input type="text" name="nombre" size="20" maxlength="50" required pattern="[A-Za-z]+" 
                 autofocus placeholder="Escribe tu nombre" form="form1">
            </td>
        </tr>
        <tr>
            <td>Apellido:</td>
            <td>
                <input type="text" name="apellido" size="20" maxlength="50" required pattern="[A-Za-z]+" 
                placeholder="Escribe tu apellido" form="form1">
            </td>
        </tr>
        <tr>
            <td>Correo Electrónico:</td>
            <td>
                <input type="email" name="correo" size="20" maxlength="50" required pattern="[A-Za-z0-9]+@gmail.com" 
                title="Correo incorrecto" placeholder="pepe@gmail.com"  form="form1">
            </td>
        </tr>
        <tr>
            <td>Número de Teléfono:</td>
            <td>
              <input type="tel" name="telefono" size="20" maxlength="12" required pattern="[0-9]{10,15}" 
                     title="Ingrese un número de teléfono válido" placeholder="Ejemplo: +34 645 34 67 29" 
                     form="form1" inputmode="tel">
            </td>
        </tr>
        <tr>
            <td>Direción:</td>
            <td>
                <input type="text" name="direccion" size="30" maxlength="100" required pattern="[A-Za-z\s\.,#'-]+ \d+,[ ]?\d+,[ ]?\d+,[ ]?\d+"
                title="Ingrese una dirección válida" placeholder="Ejemplo: C/ Maestro Rodrigo 13, 3, 5" 
                form="form1">
            </td>
        </tr>
        <tr>
            <td>Contraseña:</td>
            <td><input type="password" name="contrasena" size="20" maxlength="50" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                title="Debe contener al menos 8 caracteres, una mayúscula, una minúscula y un número" 
                placeholder="Escribe tu contraseña" form="form1">
            </td>
        </tr>

        <tr>
            <td>
                <input class="styled-button" type="reset" value="Vaciar el Formulario" form="form1">
            </td>
            <td>
                <input class="styled-button" type="submit" value="Crear mi cuenta" form="form1">
                <input class="styled-button" type="button" onclick="window.history.back()" value="Volver atrás" form="form1">
            </td>
        </tr>
    </table>
    

    <mi-pie></mi-pie>
    <script src="menu.js"></script>
    <script src="pie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
        crossorigin="anonymous">
    </script>
  </body>
</html>
