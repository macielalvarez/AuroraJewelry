<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contáctanos</title>
    <link rel="icon" type="image/ico" href="./img/gem.png" sizes="64x64">
    <link rel="stylesheet" type="text/css" href="estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" 
    crossorigin="anonymous">
  </head>
  <body>
    <mi-menu></mi-menu>
    <form action="http://www.uv.es" id="form1" method="post">
    </form>
    
    <table class="formulario">
      <th id="contacto"><h3>Contáctanos</h3></th>     
      <tr>
          <td>Nombre:</td>
          <td><input type="text" name="nombre" size="20" maxlength="50" required pattern="[A-Za-z]+" 
            autofocus placeholder="Escribe tu nombre" form="form1"></td>
      </tr>
      <tr>
          <td>Correo Electrónico:</td>
          <td><input type="email" name="correo" size="20" maxlength="50" required pattern="[A-Za-z0-9]+@gmail.com" 
            title="Correo incorrecto" placeholder="pepe@gmail.com"  form="form1"></td>
      </tr>
      <tr>
          <td>Teléfono:</td>
          <td><input type="tel" name="telefono" size="20" maxlength="9" required pattern="[0-9]+" 
            title="Sólo números" placeholder="Máximo 9 números" form="form1"></td>
      </tr>
      <tr>
          <td>Información opcional:</td>
          <td><textarea name="Descripción" rows="4" cols="25" form="form1"></textarea></td>
      </tr>
      <tr>
        <td><input class="styled-button" type="reset" value="Vaciar el Formulario" form="form1"></td>
        <td>
          <input class="styled-button" type="submit" value="Enviar los datos" form="form1">
          <input class="styled-button" type="button" onclick="window.history.back()" value="Volver atrás" form="form1">
        </td>
      </tr>
      <tr>
        <td><h4 class="contacto1">Mapa de localización</h4></td>  
        <td>
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3078.085431143384!2d-0.42461040000000044!3d39.5125615!2m3!1f0!
            2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd60450d03d31e81%3A0xb2d49176f911a805!2sETSE%20-%20Escuela%20T%C3%A9cnica%20Superior%20d
            e%20Ingenier%C3%ADa%20(Universidad%20de%20Valencia)!5e0!3m2!1ses!2ses!4v1709131352659!5m2!1ses!2ses" 
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </td>
      </tr>
      <tr>
        <td><h4 class="contacto1">Llámanos</h4></td>
        <td><h5>+34 600 74 98 27</h5></td>
      </tr>
      <tr>
        <td><h4 class="contacto2">Horario de atención</h4></td>
        <td><h5 class="contacto3">Lunes a Viernes de 08:00 - 18:00</h5></td>
      </tr>
  </table>
    <mi-pie></mi-pie>
    <script src="menu.js"></script>
    <script src="pie.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" 
    crossorigin="anonymous"></script>
  </body>
</html>
